name: CI

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.18.0
      - name: Install dependencies
        run: npm ci --no-fund
      - name: Typecheck
        run: npm run test:types
      - name: Lint
        run: npm run lint
      - name: Format
        run: npx prettier --check "src/**/*.{ts,tsx,css}" "tests/**/*.ts" "dev/**/*.ts"
      - name: Tests with coverage
        run: npx vitest run --coverage --coverage.reporter=json-summary --coverage.reporter=text --reporter=default --reporter=json --outputFile.json=coverage/results.json
      - name: Job summary
        if: always()
        run: node tools/ci-summary.mjs >> "$GITHUB_STEP_SUMMARY"
      - name: Build
        run: npm run build

  browser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.18.0
      - name: Install dependencies
        run: npm ci --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser tests with axe-core
        run: npx playwright test
